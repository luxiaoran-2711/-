<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>嫂子模拟器 · 完整版</title>
    <style>
        /* 基础主题变量 - 默认浅粉色 (聊天模式) */
        :root {
            --bg-start: #f5e0f0;
            --bg-end: #ecd9ff;
            --app-bg: rgba(255,248,252,0.88);
            --nav-bg: rgba(255,245,250,0.8);
            --border-color: #ffd0e6;
            --title-color: #b34e74;
            --input-bg: #fff0f5;
            --btn-bg: #ff7ca8;
            --action-bg: #ffe2ef;
            --item-hover: rgba(255,200,220,0.3);
            --toast-bg: rgba(255,220,230,0.95);
        }

        /* 现实模式 (浅蓝色系) */
        body.reality-mode {
            --bg-start: #d9e8f5;
            --bg-end: #c5d9f0;
            --app-bg: rgba(240,248,255,0.88);
            --nav-bg: rgba(235,245,255,0.8);
            --border-color: #c5d9e8;
            --title-color: #3a6b8a;
            --input-bg: #e8f0f8;
            --btn-bg: #5a8fb0;
            --action-bg: #d9e8f5;
            --item-hover: rgba(100,150,200,0.2);
            --toast-bg: rgba(210,230,245,0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a0b1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
            padding: 16px;
            transition: background 0.2s;
        }

        body.reality-mode {
            background: #0f1a2e;
        }

        .phone {
            max-width: 390px;
            width: 100%;
            height: 750px;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            border-radius: 48px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.25), 0 0 0 8px #fff5fc;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: background 0.2s;
        }

        .dynamic-island {
            background: rgba(0,0,0,0.55);
            margin: 12px 20px 6px;
            border-radius: 30px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
            backdrop-filter: blur(20px);
        }

        .app-screen {
            flex: 1;
            background: var(--app-bg);
            border-radius: 32px 32px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.2s;
            position: relative;
        }

        /* 头部导航 */
        .nav-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .back-btn, .menu-icon-btn, .mode-switch-btn, .send-all-top-btn, .tab-nav-btn, .close-page-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-title {
            flex: 1;
            font-weight: 650;
            font-size: 18px;
            color: var(--title-color);
        }

        /* 聊天列表 */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: transparent;
            margin: 0;
            border-radius: 0;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 0.5px solid var(--border-color);
        }

        .chat-item:active {
            background: var(--item-hover);
        }

        .avatar {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #ffb8d2, #ff8eb5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-right: 14px;
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name {
            font-weight: 700;
            color: var(--title-color);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .chat-preview {
            font-size: 13px;
            color: #a66884;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .add-btn {
            background: #ff86b3;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin: 12px auto;
            cursor: pointer;
            box-shadow: 0 2px 8px #fca5c4;
        }

        /* 聊天窗口内部样式 */
        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--app-bg);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.outgoing {
            justify-content: flex-end;
        }

        .message-row.incoming {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 78%;
            padding: 10px 16px;
            border-radius: 22px;
            font-size: 0.95rem;
            line-height: 1.45;
            word-wrap: break-word;
            transition: background 0.2s, border 0.2s;
        }

        .incoming .bubble {
            background: #e9e9ef;
            border: none;
            color: #171413;
        }

        .msg-name {
            font-size: 11px;
            margin: 0 0 4px 8px;
            color: #b36b8a;
        }

        .outgoing .msg-name {
            text-align: right;
            margin-right: 8px;
        }

        .typing-indicator {
            font-size: 12px;
            color: var(--title-color);
            padding: 8px 16px;
            font-style: italic;
        }

        .input-area {
            flex-shrink: 0;
            padding: 10px 12px;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            background: var(--input-bg);
            border-radius: 30px;
            padding: 8px 16px;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--title-color);
        }

        .send-btn {
            background: var(--btn-bg);
            border: none;
            padding: 8px 20px;
            border-radius: 32px;
            font-size: 0.9rem;
            font-weight: 520;
            color: white;
            cursor: pointer;
        }

        .mode-badge {
            background: var(--action-bg);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 12px;
            margin: 8px 12px;
            width: fit-content;
            cursor: pointer;
        }

        /* 气泡主题 */
        body.theme-pink .outgoing .bubble { background: #f3bdd5; border: 1px solid #fd85ad; color: #1f1a16; }
        body.theme-purple .outgoing .bubble { background: #cbbee2; border: 1px solid #8e86c2; color: #1f1a16; }
        body.theme-blue .outgoing .bubble { background: #bfe0eb; border: 1px solid #6dabde; color: #1f1a16; }
        .bubble::before, .bubble::after { display: none !important; }
        .bubble { border-radius: 22px !important; }

        /* 底部固定导航栏 */
        .tab-bar {
            display: flex;
            background: var(--nav-bg);
            padding: 8px 0 12px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .tab-item {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--title-color);
            cursor: pointer;
            opacity: 0.7;
        }
        .tab-item.active { opacity: 1; font-weight: 600; }
        .tab-icon { font-size: 22px; display: block; }

        /* 设置页面 */
        .settings-panel { padding: 20px; overflow-y: auto; flex: 1; }
        .setting-field { margin-bottom: 16px; }
        .setting-field label { font-weight: 600; color: var(--title-color); display: block; margin-bottom: 6px; }
        .setting-field input, .setting-field select, .setting-field textarea {
            width: 100%; padding: 10px; border-radius: 40px; border: 1px solid var(--border-color); background: white;
        }

        /* 微博样式 */
        .weibo-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .weibo-tabs { display: flex; background: var(--nav-bg); border-bottom: 1px solid var(--border-color); }
        .weibo-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 500; color: var(--title-color); cursor: pointer; opacity: 0.6; }
        .weibo-tab.active { opacity: 1; border-bottom: 2px solid var(--btn-bg); }
        .weibo-feed, .my-bot-feed { flex: 1; overflow-y: auto; padding: 12px; }
        .weibo-card, .bot-card { background: white; border-radius: 24px; padding: 14px; margin-bottom: 14px; }
        .weibo-header { display: flex; gap: 12px; align-items: center; }
        .weibo-name { font-weight: 700; color: #b13e66; }
        .weibo-time { font-size: 10px; color: #c48aa8; }
        .weibo-content { margin: 10px 0 6px 50px; }
        .weibo-stats { margin-left: 50px; font-size: 12px; color: #ad6b89; display: flex; gap: 20px; }
        .hot-search { background: #fff0f7; border-radius: 28px; padding: 12px; margin: 12px; cursor: pointer; }
        .hot-item { display: flex; gap: 12px; padding: 8px 0; border-bottom: 0.5px solid #ffd5e4; }
        .hot-rank { font-weight: bold; color: #f86442; width: 30px; }
        .comment-item { font-size: 12px; color: #6b4a5a; margin-top: 6px; padding-left: 30px; }
        .bot-post-actions { display: flex; gap: 16px; margin-left: 50px; margin-top: 8px; font-size: 12px; color: #ad6b89; }
        .add-post-btn { background: var(--btn-bg); color: white; border: none; padding: 6px 14px; border-radius: 30px; font-size: 13px; cursor: pointer; }

        /* 编辑微博页面 */
        .edit-post-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--app-bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
        }
        .edit-textarea {
            flex: 1;
            width: 100%;
            padding: 20px;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            resize: none;
        }

        /* 热搜页面 */
        .hotsearch-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--app-bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        /* 自定义Toast弹窗 */
        .custom-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: var(--toast-bg);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 60px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            font-size: 15px;
            font-weight: 500;
            color: var(--title-color);
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            white-space: nowrap;
            border: 0.5px solid var(--border-color);
        }
        .custom-toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .action-sheet-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            display: flex;
            align-items: flex-end;
        }
        .action-sheet {
            background: white;
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            padding: 20px 16px 30px;
        }
        .action-item { padding: 14px 0; text-align: center; font-size: 17px; border-bottom: 0.5px solid #f0f0f0; cursor: pointer; }
        .action-cancel { margin-top: 12px; color: #ff3b30; font-weight: 600; }
        .action-section-title { font-size: 13px; color: #888; padding: 8px 0 4px; }
        .empty-tip { text-align: center; padding: 40px; color: #aaa; }
    </style>
</head>
<body>
<div class="phone">
    <div class="dynamic-island"><span>9:41</span><span>📶 🔋</span></div>
    <div class="app-screen" id="appScreen"></div>
</div>

<script>
    // ==================== 数据 ====================
    let idols = [];
    let nextId = 3;
    let currentIdolId = null;
    let currentView = 'chatList';
    let editingIdolId = null;
    let viewingHeartId = null;
    let isWaitingReply = false;
    let realityMode = false;
    let pendingUserMessages = [];

    let weiboFeeds = [];
    let myBotPosts = [];
    let hotSearchList = [];
    
    let showEditPost = false;
    let showHotSearch = false;
    let weiboSubTab = 'home';

    let apiSettings = {
        baseUrl: "https://api.supxh.xin/v1",
        key: "sk-4yNGVsiLlG00zpDispYIcKgdzk3pHI0vXRCrxROXZP6c2ToE",
        model: "gemini-3-flash",
        connected: false,
        lastError: ""
    };

    const modelOptions = ["gemini-3-flash", "gemini-2.5-pro", "gemini-3.1-pro", "claude-sonnet-4-5", "claude-opus-4-5"];
    let bubbleTheme = localStorage.getItem('chatBubbleTheme') || 'pink';
    const themes = ['pink', 'purple', 'blue'];

    function applyTheme(themeName) {
        themes.forEach(t => document.body.classList.remove(`theme-${t}`));
        document.body.classList.add(`theme-${themeName}`);
        localStorage.setItem('chatBubbleTheme', themeName);
    }

    // 自定义Toast弹窗
    function showToast(message, duration = 2000) {
        let toast = document.querySelector('.custom-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'custom-toast';
            document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    function buildFullApiUrl() {
        let url = apiSettings.baseUrl.trim();
        if (url.endsWith("/chat/completions")) return url;
        if (url.endsWith("/v1")) return url + "/chat/completions";
        if (url.endsWith("/")) return url + "v1/chat/completions";
        return url + "/v1/chat/completions";
    }

    async function testApiConnection() {
        if (!apiSettings.baseUrl || !apiSettings.key) {
            apiSettings.connected = false;
            apiSettings.lastError = "API地址或Key为空";
            return false;
        }
        const fullUrl = buildFullApiUrl();
        try {
            const response = await fetch(fullUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiSettings.key}` },
                body: JSON.stringify({ model: apiSettings.model, messages: [{ role: "user", content: "说ok" }], max_tokens: 5 })
            });
            const data = await response.json();
            if (response.ok && !data.error) {
                apiSettings.connected = true;
                apiSettings.lastError = "";
                return true;
            } else {
                apiSettings.connected = false;
                apiSettings.lastError = data.error?.message || `HTTP ${response.status}`;
                return false;
            }
        } catch (e) {
            apiSettings.connected = false;
            apiSettings.lastError = e.message;
            return false;
        }
    }

    // AI生成微博动态
    async function generateWeiboFeeds() {
        if (!apiSettings.connected) return generateMockFeeds();
        const idol = idols[0];
        if (!idol) return [];
        const recentPublicChats = idol.chats.slice(-15).filter(msg => {
            const privateKeywords = ['见面', '偷偷', '私聊', '拉黑', '宝贝', '秘密'];
            return !privateKeywords.some(kw => msg.text.includes(kw));
        }).slice(-6).map(msg => `${msg.role === 'me' ? '粉丝' : idol.name}: ${msg.text.substring(0, 40)}`);
        
        const prompt = `你是微博内容生成器。根据以下信息生成5条微博动态：
        爱豆：${idol.name}（${idol.persona.group}，${idol.persona.role}）
        最近公开动态：${recentPublicChats.join('; ')}
        
        生成5条动态，格式：类型|用户名|内容|点赞数
        类型：fan/marketing/hater/cp/stan
        点赞数100-8000
        内容真实自然，有网络感。不要泄露嫂子私联信息。`;
        
        try {
            const response = await fetch(buildFullApiUrl(), {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiSettings.key}` },
                body: JSON.stringify({ model: apiSettings.model, messages: [{ role: "user", content: prompt }], temperature: 0.9, max_tokens: 800 })
            });
            const data = await response.json();
            if (response.ok && data.choices) {
                const text = data.choices[0].message.content;
                const lines = text.split('\n').filter(l => l.includes('|'));
                const feeds = [];
                for (const line of lines) {
                    const parts = line.split('|');
                    if (parts.length >= 3) {
                        feeds.push({
                            type: parts[0].trim(),
                            name: parts[1].trim(),
                            text: parts[2].trim(),
                            likes: parseInt(parts[3]) || Math.floor(Math.random() * 5000) + 200,
                            time: Date.now() - Math.random() * 86400000
                        });
                    }
                }
                if (feeds.length >= 3) return feeds;
            }
            return generateMockFeeds();
        } catch(e) { return generateMockFeeds(); }
    }
    
    function generateMockFeeds() {
        const fanNames = ["草莓味小甜心", "追星少女七七", "星星守护者", "月亮不营业"];
        const marketingNames = ["圈内密探", "娱乐显微镜", "瓜田老舅", "爆姐来了"];
        const haterNames = ["专注反炒", "清醒路人", "正义路人", "别来沾边"];
        const cpNames = ["星辰CP超话", "野隽是真的", "星月神话", "今天发糖了吗"];
        return [
            { type: 'fan', name: fanNames[0], text: `💖 哥哥今天上班图绝了！状态也太好了吧！`, likes: 2345, time: Date.now() - 3600000 },
            { type: 'marketing', name: marketingNames[0], text: `【讨论】${idols[0]?.name}最近频繁出入录音室，新专辑要来了？`, likes: 5678, time: Date.now() - 7200000 },
            { type: 'hater', name: haterNames[0], text: `说实话，这位的唱功真的被高估了。`, likes: 345, time: Date.now() - 10800000 },
            { type: 'cp', name: cpNames[0], text: `救命！今天的互动也太甜了吧！！！眼神拉丝`, likes: 8901, time: Date.now() - 14400000 },
            { type: 'fan', name: fanNames[1], text: `谁懂啊家人们，这段直拍我循环了100遍`, likes: 1234, time: Date.now() - 18000000 }
        ];
    }
    
    async function generateHotSearch() {
        if (!apiSettings.connected) return generateMockHotSearch();
        const idol = idols[0];
        const prompt = `生成8条内娱热搜榜话题，格式：话题|热度。话题格式：#内容#，热度如：128.6万。可包含${idol?.name}、${idol?.persona.group}相关内容。`;
        try {
            const response = await fetch(buildFullApiUrl(), {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiSettings.key}` },
                body: JSON.stringify({ model: apiSettings.model, messages: [{ role: "user", content: prompt }], temperature: 0.9, max_tokens: 500 })
            });
            const data = await response.json();
            if (response.ok && data.choices) {
                const lines = data.choices[0].message.content.split('\n').filter(l => l.includes('|'));
                const list = [];
                for (let i = 0; i < lines.length && i < 8; i++) {
                    const [title, heat] = lines[i].split('|');
                    list.push({ rank: i+1, title: title.trim(), heat: heat?.trim() || `${Math.floor(Math.random()*100+20)}万` });
                }
                if (list.length >= 5) return list;
            }
            return generateMockHotSearch();
        } catch(e) { return generateMockHotSearch(); }
    }
    
    function generateMockHotSearch() {
        const idol = idols[0];
        return [
            { rank:1, title: `#${idol?.name} 机场饭拍#`, heat: "128.6万" },
            { rank:2, title: `#${idol?.name} 新歌预告#`, heat: "102.3万" },
            { rank:3, title: `#${idol?.persona.group} 演唱会加场#`, heat: "89.1万" },
            { rank:4, title: `#内娱红毯比美#`, heat: "76.4万" },
            { rank:5, title: `#xxx新剧官宣#`, heat: "65.2万" },
            { rank:6, title: `#音乐盛典阵容#`, heat: "54.8万" },
            { rank:7, title: `#爆款综艺录制路透#`, heat: "43.5万" },
            { rank:8, title: `#时尚周明星造型#`, heat: "32.1万" }
        ];
    }
    
    async function generateCommentsForPost(postText) {
        if (!apiSettings.connected) return ["好甜！代了", "梦女收收味", "kswl", "这也太细节了吧"];
        const prompt = `用户发了一条匿名梦女微博："${postText}"，生成4-6条真实网友评论，每条一行。`;
        try {
            const response = await fetch(buildFullApiUrl(), {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiSettings.key}` },

    // 强制拆分回复，确保聊天模式不会出现括号动作
    function splitReplies(text, isRealityMode) {
        if (!text) return [];
        let processedText = text;
        if (!isRealityMode) {
            processedText = text.replace(/\([^)]*\)/g, '').replace(/（[^）]*）/g, '').trim();
            if (!processedText) processedText = text;
        }
        let parts = processedText.split('|').filter(p => p.trim().length > 0);
        if (parts.length > 1) return parts.map(p => p.trim());
        let sentences = processedText.split(/(?<=[。！？.!?])\s*\n?/).filter(s => s.trim().length > 0);
        if (sentences.length > 1) return sentences.map(s => s.trim());
        return [processedText.trim()];
    }
    
    function parseMessage(text) {
        if (!realityMode) return { type: 'normal', parts: [{ type: 'normal', content: text }] };
        const parts = [];
        let remaining = text;
        const actionRegex = /\(([^)]+)\)/g;
        let match;
        let lastIndex = 0;
        while ((match = actionRegex.exec(remaining)) !== null) {
            if (match.index > lastIndex) parts.push({ type: 'normal', content: remaining.substring(lastIndex, match.index) });
            parts.push({ type: 'action', content: match[1] });
            lastIndex = match.index + match[0].length;
        }
        if (lastIndex < remaining.length) parts.push({ type: 'normal', content: remaining.substring(lastIndex) });
        if (parts.length === 0) parts.push({ type: 'normal', content: text });
        return { type: 'mixed', parts: parts };
    }
    
    function renderMessageBubble(text) {
        if (!realityMode) return `<div class="bubble"><span class="normal-text">${escapeHtml(text)}</span></div>`;
        const parsed = parseMessage(text);
        let html = '<div class="bubble">';
        for (const part of parsed.parts) {
            if (part.type === 'action') html += `<span class="action-text">（${escapeHtml(part.content)}）</span>`;
            else html += `<span class="normal-text">${escapeHtml(part.content)}</span>`;
        }
        html += '</div>';
        return html;
    }
    
    async function generateAIReply(idol, userMessages, meetMode, isRealityMode) {
        if (!apiSettings.connected) return ["（API未连接，请检查设置）"];
        const fullUrl = buildFullApiUrl();
        const combinedMsg = userMessages.map((m, i) => `(${i + 1}) ${m}`).join('\n');
        let modeInstruction = "";
        if (isRealityMode) {
            modeInstruction = "你现在是【现实模式】。你可以使用（动作描写）来表达动作，例如：（轻轻摸了摸她的头）或者（低头笑了笑）。每条回复可以包含动作和对话。回复中用 | 符号分隔多条独立消息。";
        } else {
            modeInstruction = "你现在是【聊天模式】。严禁使用任何括号、星号、动作描写。只能输出纯文字对话内容，就像真实的微信聊天一样。回复中用 | 符号分隔多条独立消息。";
        }
        const sysPrompt = `你是爱豆${idol.name}，人设：${idol.persona?.longBio || ''}，称呼对方为“${idol.persona?.nickname || '姐姐'}”。${meetMode ? '见面模式。' : ''}
${modeInstruction}
用户连续发了多条消息，请根据剧情和人设生成1-7条独立回复，用|分隔。回复内容要符合当前模式要求。`;
        try {
            const response = await fetch(fullUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiSettings.key}` },
                body: JSON.stringify({ model: apiSettings.model, messages: [{ role: "system", content: sysPrompt }, { role: "user", content: combinedMsg }], temperature: 0.85, max_tokens: 800 })
            });
            const data = await response.json();
            if (response.ok && data.choices) {
                let rawReply = data.choices[0].message.content;
                let replies = splitReplies(rawReply, isRealityMode);
                if (replies.length === 0) replies = [rawReply];
                return replies;
            }
            return null;
        } catch(e) { return null; }
    }

    async function triggerAIReply() {
        const idol = idols.find(i => i.id === currentIdolId);
        if (!idol || idol.settings.isBlocked) return;
        if (pendingUserMessages.length === 0) { showToast("没有需要回复的消息～"); return; }
        if (isWaitingReply) return;
        const messagesToReply = [...pendingUserMessages];
        pendingUserMessages = [];
        saveAll();
        isWaitingReply = true;
        const typingDiv = document.getElementById('typingArea');
        if (typingDiv) typingDiv.innerHTML = '<div class="typing-indicator">✨ 对方正在输入...</div>';
        scrollToBottom();
        const replies = await generateAIReply(idol, messagesToReply, idol.settings.meetMode, realityMode);
        if (typingDiv) typingDiv.innerHTML = '';
        isWaitingReply = false;
        if (replies && replies.length > 0) {
            for (let reply of replies) {
                idol.chats.push({ role: "other", text: reply.trim(), time: Date.now() });
                saveAll();
                render();
                scrollToBottom();
                await new Promise(r => setTimeout(r, 200));

                sections: [
                    { title: "——— 人设编辑 ———", items: [{ action: 'editPersona', label: '✏️ 编辑详细人设' }] },
                    { title: "——— 气泡颜色 ———", items: [{ action: 'themePink', label: '🌸 粉嫩气泡' }, { action: 'themePurple', label: '💜 淡紫优雅' }, { action: 'themeBlue', label: '💙 水清浅蓝' }] },
                    { title: "——— 聊天设置 ———", items: [{ action: 'block', label: idol?.settings?.isBlocked ? '🔓 解除拉黑' : '🚫 拉黑好友' }, { action: 'dnd', label: idol?.settings?.isDnd ? '🔔 关闭免打扰' : '🔕 消息免打扰' }, { action: 'clearChat', label: '🗑️ 清空聊天记录' }, { action: 'deleteFriend', label: '❌ 删除好友' }] }
                ],
                callback: (action) => {
                    if (action === 'editPersona') { editingIdolId = currentIdolId; currentView = 'editor'; render(); }
                    else if (action === 'themePink') applyTheme('pink');
                    else if (action === 'themePurple') applyTheme('purple');
                    else if (action === 'themeBlue') applyTheme('blue');
                    else if (action === 'block') { idol.settings.isBlocked = !idol.settings.isBlocked; saveAll(); render(); showToast(idol.settings.isBlocked ? "已拉黑" : "已解除拉黑"); }
                    else if (action === 'dnd') { idol.settings.isDnd = !idol.settings.isDnd; saveAll(); render(); showToast(idol.settings.isDnd ? "已开启免打扰" : "已关闭免打扰"); }
                    else if (action === 'clearChat') { idol.chats = []; saveAll(); render(); showToast("聊天记录已清空"); }
                    else if (action === 'deleteFriend') { if(confirm(`彻底删除${idol.name}？`)){ idols = idols.filter(i=>i.id!==currentIdolId); currentIdolId=null; currentView='chatList'; saveAll(); render(); showToast("已删除"); } }
                }
            });
        });
        
        document.getElementById('testApiBtn')?.addEventListener('click',async()=>{ let statusDiv=document.getElementById('apiStatusMsg'); statusDiv.innerHTML='⏳ 测试中...'; apiSettings.baseUrl=document.getElementById('apiUrl').value; apiSettings.key=document.getElementById('apiKey').value; let modelSelect=document.getElementById('apiModelSelect').value; let modelCustom=document.getElementById('apiModelCustom').value; apiSettings.model=modelCustom||modelSelect; let ok=await testApiConnection(); statusDiv.innerHTML=ok?'✅ API连接成功！':`❌ 连接失败: ${apiSettings.lastError}`; saveAll(); if(ok) showToast("API连接成功"); });
        document.getElementById('saveApiBtn')?.addEventListener('click',async()=>{ apiSettings.baseUrl=document.getElementById('apiUrl').value; apiSettings.key=document.getElementById('apiKey').value; let modelSelect=document.getElementById('apiModelSelect').value; let modelCustom=document.getElementById('apiModelCustom').value; apiSettings.model=modelCustom||modelSelect; await testApiConnection(); saveAll(); showToast("API设置已保存"); render();});
        document.getElementById('savePersonaBtn')?.addEventListener('click',()=>{ let idol=idols.find(i=>i.id===editingIdolId); if(idol){ idol.name=document.getElementById('editName').value; idol.persona.nickname = document.getElementById('editNick').value || document.getElementById('nickname').value; idol.persona.group=document.getElementById('editGroup').value; idol.persona.longBio=document.getElementById('longBio').value; if(document.getElementById('nickname').value) idol.persona.nickname = document.getElementById('nickname').value; saveAll(); showToast("人设保存成功 ✨"); currentView='chatList'; render(); } });
        document.getElementById('genHeartNow')?.addEventListener('click',()=>{ let idol=idols.find(i=>i.id===viewingHeartId); if(idol){ idol.memories.push({text:"（内心）今天和她聊天，心里暖暖的。",time:Date.now()}); saveAll(); render(); showToast("已生成心里话"); } });
        document.querySelectorAll('.delMemBtn').forEach(btn=>{btn.onclick=(e)=>{ let idx=parseInt(btn.dataset.idx); let idol=idols.find(i=>i.id===viewingHeartId); if(idol) idol.memories.splice(idol.memories.length-1-idx,1); saveAll(); render(); showToast("已删除"); };});
    }
    
    function render() {
        const container = document.getElementById('appScreen');
        if(!container) return;
        let content = '';
        if (showEditPost) { content = renderEditPostPage(); }
        else if (showHotSearch) { content = renderHotSearchPage(); }
        else if (currentView === 'chatList') content = renderChatList();
        else if (currentView === 'chatRoom' && currentIdolId) content = renderChatRoom();
        else if (currentView === 'weiboPublic') content = renderWeiboContainer();
        else if (currentView === 'settings') content = renderSettings();
        else if (currentView === 'editor' && editingIdolId) content = renderEditor();
        else if (currentView === 'heartMemo' && viewingHeartId) content = renderHeartMemo();
        else content = renderChatList();
        container.innerHTML = content;
        attachEvents();
        scrollToBottom();
    }
    
    applyTheme(bubbleTheme);
    loadData();
    if(realityMode) document.body.classList.add('reality-mode');
    testApiConnection().then(()=>render());
</script>
</body>
</html>
